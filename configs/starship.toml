# Prompt config, linked to ~/.config/starship.toml by scripts/install.sh. Options: https://starship.rs/config/
# Where you are (🏠 this machine, 🪐 a Codespace, 🍓 a host over SSH), folder and git on the left, details on the right.

palette = "fisheries"

format = "${custom.home}${env_var.CODESPACE_DISPLAYNAME}$hostname$directory$git_branch$git_status${custom.dirty}$git_state$character"
right_format = "$status$cmd_duration$jobs$time"

# Fisheries Innovation Scotland
# https://www.color-hex.com/color-palette/94084
# Blues for where you are, orange for what needs attention.
[palettes.fisheries]
machine = "#348bc3"
path = "#66b2e4"
path_shortened = "#405592"
branch = "#348bc3"
changes = "#f49b45"
arrow = "#66b2e4"
arrow_error = "#f49b45"
exit_code = "#f49b45"
details = "#348bc3" # command duration, time, rebase/merge state
jobs = "#66b2e4"

# 🏠 on this machine (WSL, macOS): neither a Codespace nor an SSH session
[custom.home]
when = 'test -z "$CODESPACES$SSH_CONNECTION$SSH_CLIENT$SSH_TTY"'
shell = ["sh"]
format = "🏠 "

[env_var.CODESPACE_DISPLAYNAME]
format = "[🪐 $env_value]($style) "
style = "machine"

# 🍓 ceres over SSH: the hostname is always there so you remember you're remoting.
# A Codespace has its own tile above, even when reached over SSH.
[hostname]
ssh_symbol = "🍓 "
detect_env_vars = ["!CODESPACES"]
format = "[$ssh_symbol$hostname]($style) "
style = "machine"

# Shrink long paths
[directory]
fish_style_pwd_dir_length = 1
style = "bold path"
before_repo_root_style = "path_shortened"
repo_root_style = "bold path"
read_only = " 🔒"

# Just use the git branch name
[git_branch]
format = "[$branch(:$remote_branch)]($style) "
style = "bold branch"

# Arrows only: ⇡ commits to push, ⇣ commits to pull
[git_status]
format = "([$ahead_behind]($style) )"
style = "bold branch"
ahead = "⇡"
behind = "⇣"
diverged = "⇡⇣"

# ● when anything is uncommitted
[custom.dirty]
require_repo = true
when = 'test -n "$(git status --porcelain)"'
shell = ["sh"]
format = "[●]($style) "
style = "changes"

[character]
success_symbol = "[❯](arrow)"
error_symbol = "[❯](arrow_error)"

[cmd_duration]
format = "[⏱️ $duration]($style) "
style = "bold details"

# async executions
[jobs]
symbol = "🔮"
style = "bold jobs"

[status]
disabled = false
format = "[$symbol $status]($style) "
style = "bold exit_code"

[git_state]
style = "bold details"

[time]
disabled = false
format = "[$time]($style)"
style = "bold details"
